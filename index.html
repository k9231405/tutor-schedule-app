    // ==========================================
    // 4. CONTEXT API & STATE MANAGEMENT
    // ==========================================
    const TutorContext = createContext();

    const TutorProvider = ({ children }) => {
      const [students, setStudents] = useState(() => {
        const saved = localStorage.getItem('tutorflow_students_v3');
        return saved ? JSON.parse(saved) : INITIAL_DATA.students;
      });

      const [pricingRules, setPricingRules] = useState(() => {
        const saved = localStorage.getItem('tutorflow_pricing_v3');
        return saved ? JSON.parse(saved) : INITIAL_DATA.pricingRules;
      });

      const [lessons, setLessons] = useState(() => {
        const saved = localStorage.getItem('tutorflow_lessons_v3');
        return saved ? JSON.parse(saved) : INITIAL_DATA.lessons;
      });

      const [userSettings, setUserSettings] = useState(() => {
        const saved = localStorage.getItem('tutorflow_settings_v3');
        return saved ? JSON.parse(saved) : INITIAL_DATA.userSettings;
      });

      const [isLoggedIn, setIsLoggedIn] = useState(true);
      const [isFinanceUnlocked, setIsFinanceUnlocked] = useState(true);
      const [toast, setToast] = useState(null);

      useEffect(() => {
        localStorage.setItem('tutorflow_students_v3', JSON.stringify(students));
      }, [students]);

      useEffect(() => {
        localStorage.setItem('tutorflow_pricing_v3', JSON.stringify(pricingRules));
      }, [pricingRules]);

      useEffect(() => {
        localStorage.setItem('tutorflow_lessons_v3', JSON.stringify(lessons));
      }, [lessons]);

      useEffect(() => {
        localStorage.setItem('tutorflow_settings_v3', JSON.stringify(userSettings));
      }, [userSettings]);

      const showToast = useCallback((message, type = 'success') => {
        setToast({ message, type, id: Date.now() });
        setTimeout(() => setToast(null), 3800);
      }, []);

      const addStudent = useCallback((newStudent) => {
        const student = {
          id: 'student-' + Date.now(),
          memos: [],
          color: newStudent.color || 'blue',
          parentName: newStudent.parentName || '未填寫',
          ...newStudent,
        };
        setStudents((prev) => [student, ...prev]);
        showToast(`成功新增學生【${student.name}】！`);
        return student;
      }, [showToast]);

      const updateStudent = useCallback((id, updatedFields) => {
        setStudents((prev) => prev.map((s) => (s.id === id ? { ...s, ...updatedFields } : s)));
        showToast('學生檔案已即時更新');
      }, [showToast]);

      const deleteStudent = useCallback((id) => {
        const student = students.find((s) => s.id === id);
        setStudents((prev) => prev.filter((s) => s.id !== id));
        setLessons((prev) => prev.filter((l) => l.studentId !== id));
        setPricingRules((prev) => prev.filter((pr) => pr.studentId !== id));
        showToast(`已刪除學生【${student?.name || ''}】及其排課與費用紀錄`, 'info');
      }, [students, showToast]);

      const addMemo = useCallback((studentId, content) => {
        if (!content.trim()) return;
        const now = new Date();
        const dateStr = `${now.getFullYear()}/${String(now.getMonth() + 1).padStart(2, '0')}/${String(now.getDate()).padStart(2, '0')} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
        const newMemo = { id: 'm-' + Date.now(), date: dateStr, content: content.trim() };
        
        setStudents((prev) =>
          prev.map((s) => {
            if (s.id === studentId) {
              return { ...s, memos: [newMemo, ...(s.memos || [])] };
            }
            return s;
          })
        );
        showToast('已新增備忘錄筆記');
      }, [showToast]);

      const updateMemo = useCallback((studentId, memoId, newContent) => {
        if (!newContent.trim()) return;
        setStudents((prev) =>
          prev.map((s) => {
            if (s.id === studentId) {
              return {
                ...s,
                memos: (s.memos || []).map((m) =>
                  m.id === memoId ? { ...m, content: newContent.trim() } : m
                ),
              };
            }
            return s;
          })
        );
        showToast('備忘錄筆記已更新完成！');
      }, [showToast]);

      const deleteMemo = useCallback((studentId, memoId) => {
        setStudents((prev) =>
          prev.map((s) => {
            if (s.id === studentId) {
              return { ...s, memos: (s.memos || []).filter((m) => m.id !== memoId) };
            }
            return s;
          })
        );
        showToast('已刪除備忘錄');
      }, [showToast]);

      // Lessons CRUD & Conflict Checking
      const checkLessonConflict = useCallback((newLesson, excludeId = null) => {
        const targetDate = newLesson.date;
        const [newStartH, newStartM] = newLesson.startTime.split(':').map(Number);
        const [newEndH, newEndM] = newLesson.endTime.split(':').map(Number);
        const newStartVal = newStartH * 60 + newStartM;
        const newEndVal = newEndH * 60 + newEndM;

        for (const les of lessons) {
          if (les.id === excludeId) continue;
          if (les.date !== targetDate) continue;

          const [lesStartH, lesStartM] = les.startTime.split(':').map(Number);
          const [lesEndH, lesEndM] = les.endTime.split(':').map(Number);
          const lesStartVal = lesStartH * 60 + lesStartM;
          const lesEndVal = lesEndH * 60 + lesEndM;

          if (Math.max(newStartVal, lesStartVal) < Math.min(newEndVal, lesEndVal)) {
            const conflictStudent = students.find((s) => s.id === les.studentId);
            return {
              hasConflict: true,
              conflictLesson: les,
              conflictStudentName: conflictStudent ? conflictStudent.name : '其他學生',
            };
          }
        }
        return { hasConflict: false };
      }, [lessons, students]);

      const saveLesson = useCallback((lessonData) => {
        const isEdit = Boolean(lessonData.id);
        const conflict = checkLessonConflict(lessonData, isEdit ? lessonData.id : null);
        if (conflict.hasConflict) {
          showToast(
            `⚠️ 排課時間衝突！該時段已排定【${conflict.conflictStudentName} - ${conflict.conflictLesson.subject}】(${conflict.conflictLesson.startTime} - ${conflict.conflictLesson.endTime})，請調整時間！`,
            'error'
          );
          return false;
        }

        const [sH, sM] = lessonData.startTime.split(':').map(Number);
        const [eH, eM] = lessonData.endTime.split(':').map(Number);
        const duration = Math.max(0.5, ((eH * 60 + eM) - (sH * 60 + sM)) / 60);

        if (isEdit) {
          setLessons((prev) =>
            prev.map((l) => (l.id === lessonData.id ? { ...l, ...lessonData, duration } : l))
          );
          showToast('課程已更新完成');
        } else {
          const newLesson = {
            id: 'les-' + Date.now() + '-' + Math.random().toString(36).substr(2, 6),
            status: 'pending',
            plannedProgress: '',
            actualStatus: '',
            ...lessonData,
            duration,
          };
          setLessons((prev) => [...prev, newLesson]);
          showToast('新課程已成功排定！');
        }
        return true;
      }, [checkLessonConflict, showToast]);

      const deleteLesson = useCallback((id) => {
        setLessons((prev) => prev.filter((l) => l.id !== id));
        showToast('已取消並刪除該堂課程', 'info');
      }, [showToast]);

      // Pricing Rules CRUD
      const setStudentPricing = useCallback((ruleData) => {
        setPricingRules((prev) => {
          const existingIndex = prev.findIndex(
            (p) => p.studentId === ruleData.studentId && p.subject === ruleData.subject
          );
          if (existingIndex >= 0) {
            const updated = [...prev];
            updated[existingIndex] = { ...updated[existingIndex], ...ruleData };
            return updated;
          } else {
            return [...prev, { id: 'pr-' + Date.now(), ...ruleData }];
          }
        });
        showToast('課程定價與收款方式已儲存');
      }, [showToast]);

      const deletePricingRule = useCallback((id) => {
        setPricingRules((prev) => prev.filter((r) => r.id !== id));
        showToast('已刪除該定價設定');
      }, [showToast]);

      // Selective Settlement Batch
      const settleLessonsBatch = useCallback((lessonIds, paymentMethod, paymentNote) => {
        if (!lessonIds || lessonIds.length === 0) {
          showToast('未勾選任何要結算的課程！', 'error');
          return;
        }
        const today = new Date().toISOString().split('T')[0];
        const stringIds = lessonIds.map(String);
        setLessons((prev) =>
          prev.map((l) =>
            stringIds.includes(String(l.id))
              ? {
                  ...l,
                  status: 'settled',
                  settledAt: today,
                  settledMethod: paymentMethod,
                  settledNote: paymentNote,
                }
              : l
          )
        );
        showToast(`已成功結清選取的 ${lessonIds.length} 堂課程款項！`, 'success');
      }, [showToast]);

      const resetDemoData = useCallback(() => {
        setStudents(INITIAL_DATA.students);
        setPricingRules(INITIAL_DATA.pricingRules);
        setLessons(INITIAL_DATA.lessons);
        setUserSettings(INITIAL_DATA.userSettings);
        showToast('已成功恢復預設範例資料！');
      }, [showToast]);

      return (
        <TutorContext.Provider
          value={{
            students,
            pricingRules,
            lessons,
            userSettings,
            setUserSettings,
            isLoggedIn,
            setIsLoggedIn,
            isFinanceUnlocked,
            setIsFinanceUnlocked,
            addStudent,
            updateStudent,
            deleteStudent,
            addMemo,
            updateMemo,
            deleteMemo,
            saveLesson,
            deleteLesson,
            setStudentPricing,
            deletePricingRule,
            settleLessonsBatch,
            resetDemoData,
            showToast,
            toast,
          }}
        >
          {children}
        </TutorContext.Provider>
      );
    };

    // ==========================================
    // 5. TOAST NOTIFICATION COMPONENT
    // ==========================================
    const ToastContainer = () => {
      const { toast } = useContext(TutorContext);
      if (!toast) return null;

      const isError = toast.type === 'error';

          <div
            className={`pointer-events-auto flex items-start gap-3 p-4 rounded-2xl shadow-modal backdrop-blur-md border text-sm font-medium transition-all ${
              isError
                ? 'bg-rose-900/90 text-white border-rose-700'
                : isInfo
                ? 'bg-slate-900/90 text-white border-slate-700'
                : 'bg-emerald-900/90 text-white border-emerald-700'

            <div className="mt-0.5 shrink-0">
              {isError ? (
                <Icon name="AlertCircle" size={18} className="text-rose-300" />
              ) : (
                <Icon name="CheckCircle2" size={18} className="text-emerald-300" />

            </div>
            <div className="flex-1 leading-relaxed">{toast.message}</div>

    };

                className="w-full text-center tracking-widest text-xl font-bold py-3 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-amber-500/20 focus:border-amber-500"

              type="button"
              onClick={() => { onUnlock(); showToast('⚡ 測試模式快速解鎖！'); }}
              className="mt-4 text-xs text-amber-700 font-medium hover:underline block mx-auto"
            >
              [測試模式] 點此一鍵免輸入 PIN 解鎖
            </button>
          </div>
        </div>
      );
    };

    // ==========================================
    // 8. SCHEDULE LESSON MODAL (CREATE / EDIT)
    // ==========================================
    const LessonFormModal = ({ isOpen, onClose, initialData = null }) => {
      const { students, lessons, pricingRules, saveLesson, deleteLesson, addStudent, showToast } = useContext(TutorContext);

      const [studentId, setStudentId] = useState('');
      const [subject, setSubject] = useState('');
      const [isNewSubjectMode, setIsNewSubjectMode] = useState(false);
      const [customSubject, setCustomSubject] = useState('');
      const [date, setDate] = useState('');
      const [startTime, setStartTime] = useState('14:00');
      const [endTime, setEndTime] = useState('16:00');
      const [plannedProgress, setPlannedProgress] = useState('');
      const [actualStatus, setActualStatus] = useState('');
      
      const [isQuickAddingStudent, setIsQuickAddingStudent] = useState(false);
      const [newStudentName, setNewStudentName] = useState('');
      const [newStudentGrade, setNewStudentGrade] = useState('國三');
      const [newParentName, setNewParentName] = useState('');
      const [newStudentPhone, setNewStudentPhone] = useState('');
      const [newStudentAddress, setNewStudentAddress] = useState('');
      const [newStudentColor, setNewStudentColor] = useState('blue');

      useEffect(() => {
        if (initialData) {
          setStudentId(initialData.studentId || (students[0]?.id || ''));
          setSubject(initialData.subject || '');
          setDate(initialData.date || new Date().toISOString().split('T')[0]);
          setStartTime(initialData.startTime || '14:00');
          setEndTime(initialData.endTime || '16:00');
          setPlannedProgress(initialData.plannedProgress || '');
          setActualStatus(initialData.actualStatus || '');
          setIsNewSubjectMode(false);
          setCustomSubject('');
          setIsQuickAddingStudent(false);
        } else {
          setStudentId(students[0]?.id || '');
          setSubject('');
          setDate(new Date().toISOString().split('T')[0]);
          setStartTime('14:00');
          setEndTime('16:00');
          setPlannedProgress('');
          setActualStatus('');
          setIsNewSubjectMode(false);
          setCustomSubject('');
          setIsQuickAddingStudent(false);
        }
      }, [initialData, isOpen, students]);

      const dynamicSubjects = useMemo(() => {
        if (!studentId) return [];
        const subjectSet = new Set();
        lessons.filter((l) => l.studentId === studentId).forEach((l) => {
          if (l.subject) subjectSet.add(l.subject);
        });
        pricingRules.filter((pr) => pr.studentId === studentId).forEach((pr) => {
          if (pr.subject) subjectSet.add(pr.subject);
        });
        return Array.from(subjectSet);
      }, [studentId, lessons, pricingRules]);

      useEffect(() => {
        if (!initialData?.id && !isNewSubjectMode && dynamicSubjects.length > 0 && !subject) {
          setSubject(dynamicSubjects[0]);
        }
      }, [dynamicSubjects, initialData, isNewSubjectMode, subject]);

      if (!isOpen) return null;

      const handleSubmit = (e) => {
        if (e) e.preventDefault();

        let finalStudentId = studentId;

        if (isQuickAddingStudent) {
          if (!newStudentName.trim()) {
            showToast('請輸入新學生姓名！', 'error');
            return;
          }
          const created = addStudent({
            name: newStudentName.trim(),
            grade: newStudentGrade,
            parentName: newParentName.trim() || '未填寫',
            phone: newStudentPhone.trim() || '未填寫',
            address: newStudentAddress.trim() || '未填寫',
            color: newStudentColor,
          });
          finalStudentId = created.id;
        }

        if (!finalStudentId) {
          showToast('請選擇或新增學生！', 'error');
          return;
        }

        const finalSubject = isNewSubjectMode ? customSubject.trim() : subject.trim();
        if (!finalSubject) {
          showToast('請選擇或輸入課程科目！', 'error');
          return;
        }

        if (startTime >= endTime) {
          showToast('課程結束時間必須晚於開始時間！', 'error');
          return;
        }

        const lessonPayload = {
          id: initialData?.id || null,
          studentId: finalStudentId,
          subject: finalSubject,
          date,
          startTime,
          endTime,
          plannedProgress,
          actualStatus,
        };

        const success = saveLesson(lessonPayload);
        if (success) {
          onClose();
        }

      const handleDelete = () => {
        if (initialData?.id) {

            deleteLesson(initialData.id);
            onClose();

        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm overflow-y-auto animate-fade-in">

            <div className="flex items-center justify-between pb-4 border-b border-slate-100">

              <button onClick={onClose} className="p-2 text-slate-400 hover:text-slate-600 rounded-xl hover:bg-slate-100">
                <Icon name="X" size={18} />
              </button>
            </div>

            <form onSubmit={handleSubmit} className="space-y-4 pt-4">
              <div>
                <div className="flex items-center justify-between mb-1.5">

                  <button
                    type="button"
                    onClick={() => setIsQuickAddingStudent(!isQuickAddingStudent)}
                    className="text-xs text-indigo-600 hover:text-indigo-800 font-semibold flex items-center gap-1"
                  >
                    <Icon name={isQuickAddingStudent ? "ChevronUp" : "Plus"} size={14} />
                    <span>{isQuickAddingStudent ? '返回下拉選擇' : '+ 快速新增新學生'}</span>
                  </button>
                </div>

                {!isQuickAddingStudent ? (
                  <select
                    value={studentId}
                    onChange={(e) => {
                      if (e.target.value === '__NEW__') {
                        setIsQuickAddingStudent(true);
                      } else {
                        setStudentId(e.target.value);
                      }
                    }}
                    className="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500"
                  >
                    {students.map((s) => (
                      <option key={s.id} value={s.id}>
                        {s.name} ({s.grade})

                    ))}
                    <option value="__NEW__" className="text-indigo-600 font-bold">
                      + 手動輸入新學生...
                    </option>
                  </select>
                ) : (
                  <div className="p-3.5 bg-indigo-50/60 border border-indigo-100 rounded-2xl space-y-2.5 animate-fade-in">
                    <div className="text-xs font-bold text-indigo-900 flex items-center gap-1">
                      <Icon name="Sparkles" size={14} />
                      <span>即時建立學生檔案 (排課自動儲存)</span>
                    </div>
                    <div className="grid grid-cols-2 gap-2">
                      <input
                        type="text"
                        placeholder="學生姓名 (例: 王小明)"
                        value={newStudentName}
                        onChange={(e) => setNewStudentName(e.target.value)}
                        className="w-full px-3 py-2 bg-white border border-indigo-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500/20"
                      />
                      <input
                        type="text"
                        placeholder="年級 (例: 國三)"
                        value={newStudentGrade}
                        onChange={(e) => setNewStudentGrade(e.target.value)}
                        className="w-full px-3 py-2 bg-white border border-indigo-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500/20"
                      />
                    </div>
                    <div className="grid grid-cols-2 gap-2">
                      <input
                        type="text"
                        placeholder="家長姓名 (例: 王爸爸)"
                        value={newParentName}
                        onChange={(e) => setNewParentName(e.target.value)}
                        className="w-full px-3 py-2 bg-white border border-indigo-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500/20"
                      />
                      <input
                        type="text"
                        placeholder="家長電話 (選填)"
                        value={newStudentPhone}
                        onChange={(e) => setNewStudentPhone(e.target.value)}
                        className="w-full px-3 py-2 bg-white border border-indigo-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500/20"
                      />
                    </div>
                    <div>
                      <input
                        type="text"
                        placeholder="上課地址 (選填)"
                        value={newStudentAddress}
                        onChange={(e) => setNewStudentAddress(e.target.value)}
                        className="w-full px-3 py-2 bg-white border border-indigo-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500/20"
                      />
                    </div>
                    <div>
                      <span className="text-[11px] font-semibold text-indigo-700 block mb-1">選擇代表顏色 (7種馬卡龍色)：</span>
                      <div className="flex gap-2">
                        {Object.values(MACARON_THEMES).map((th) => (
                          <button
                            key={th.id}
                            type="button"
                            onClick={() => setNewStudentColor(th.id)}
                            className={`w-6 h-6 rounded-full border-2 transition-all ${th.bg} ${
                              newStudentColor === th.id ? 'border-indigo-600 scale-110 shadow-sm ring-2 ring-indigo-300' : 'border-transparent'
                            }`}
                            title={th.name}
                          />
                        ))}
                      </div>
                    </div>
                  </div>
                )}
              </div>

              <div>
                <div className="flex items-center justify-between mb-1.5">
                  <label className="text-xs font-bold text-slate-700">上課科目 (動態關聯)</label>
                  <button
                    type="button"
                    onClick={() => {
                      setIsNewSubjectMode(!isNewSubjectMode);
                      if (!isNewSubjectMode) setCustomSubject('');
                    }}
                    className="text-xs text-indigo-600 hover:text-indigo-800 font-semibold flex items-center gap-1"
                  >
                    <Icon name="Edit3" size={13} />
                    <span>{isNewSubjectMode ? '選擇既有科目' : '+ 手動輸入新科目'}</span>
                  </button>
                </div>

                {!isNewSubjectMode ? (
                  <div className="space-y-1.5">
                    {dynamicSubjects.length > 0 ? (
                      <select
                        value={subject}
                        onChange={(e) => {
                          if (e.target.value === '__CUSTOM__') {
                            setIsNewSubjectMode(true);
                          } else {
                            setSubject(e.target.value);
                          }
                        }}
                        className="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500"
                      >
                        {dynamicSubjects.map((sub) => (
                          <option key={sub} value={sub}>
                            {sub} (過往上課/定價科目)
                          </option>
                        ))}
                        <option value="__CUSTOM__" className="text-indigo-600 font-bold">
                          + 輸入其他新科目...
                        </option>
                      </select>
                    ) : (
                      <div className="flex gap-2">
                        <input
                          type="text"
                          placeholder="例如: 國中理化、高中英文..."
                          value={customSubject}
                          onChange={(e) => setCustomSubject(e.target.value)}
                          className="flex-1 px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500/20"
                        />
                      </div>

                  </div>
                ) : (
                  <input
                    type="text"
                    autoFocus
                    placeholder="請輸入新科目 (例如: AP微積分、高中生物...)"
                    value={customSubject}
                    onChange={(e) => setCustomSubject(e.target.value)}
                    className="w-full px-3.5 py-2.5 bg-slate-50 border border-indigo-300 rounded-xl text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500/20"
                  />
                )}
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                <div className="sm:col-span-1">
                  <label className="block text-xs font-bold text-slate-700 mb-1.5">上課日期</label>
                  <input
                    type="date"
                    value={date}
                    onChange={(e) => setDate(e.target.value)}
                    className="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-medium focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500/20"
                  />

                  <label className="block text-xs font-bold text-slate-700 mb-1.5">開始時間</label>
                  <input
                    type="time"
                    step="900"
                    value={startTime}

                    className="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-medium focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500/20"
                  />

                  <label className="block text-xs font-bold text-slate-700 mb-1.5">結束時間</label>
                  <input
                    type="time"
                    step="900"

                    onChange={(e) => setEndTime(e.target.value)}
                    className="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-medium focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500/20"

                <textarea
                  rows="2"

                  placeholder="例: 第 3 章 多項式因式分解與歷屆大考題型剖析"
                  className="w-full px-3.5 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500/20"
                />
              </div>

              <div>
                <label className="block text-xs font-bold text-slate-700 mb-1.5">實際狀況 (課堂回饋/測驗結果)</label>
                <textarea
                  rows="2"
                  value={actualStatus}
                  onChange={(e) => setActualStatus(e.target.value)}
                  placeholder="例: 小考 90 分，公式推導熟練，剩餘 2 題作業待下次檢討"
                  className="w-full px-3.5 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500/20"
                />

              <div className="flex items-center justify-between pt-3 border-t border-slate-100">
                {initialData?.id ? (
                  <button
                    type="button"
                    onClick={handleDelete}
                    className="px-3.5 py-2.5 bg-rose-50 hover:bg-rose-100 text-rose-700 font-semibold text-xs rounded-xl flex items-center gap-1.5 transition-colors"
                  >
                    <Icon name="Trash2" size={15} />
                    <span>刪除課程</span>

                <div className="flex gap-2.5">

                    className="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold rounded-xl shadow-md shadow-indigo-100 flex items-center gap-1.5"
                  >
                    <Icon name="Check" size={15} />

                  </button>

    // ==========================================
    // 9. MODULE 2: CALENDAR & TIMELINE
    // ==========================================
    const CalendarModule = () => {
      const { students, lessons, userSettings, setUserSettings, saveLesson, showToast } = useContext(TutorContext);

      const [currentDate, setCurrentDate] = useState(() => new Date());
      const [viewMode, setViewMode] = useState('week');
      const [modalState, setModalState] = useState({ isOpen: false, data: null });
      const [draggedLesson, setDraggedLesson] = useState(null);
      const [dragOverKey, setDragOverKey] = useState(null);

      const startHour = userSettings.startHour ?? 10;
      const endHour = userSettings.endHour ?? 22;

      const handleUpdateBusinessHours = (newStart, newEnd) => {
        const s = Number(newStart);
        const e = Number(newEnd);
        if (s >= e) {
          showToast('上班開始時間必須早於結束時間！', 'error');
          return;
        }
        setUserSettings((prev) => ({ ...prev, startHour: s, endHour: e }));
        showToast(`上班時間軸已更新為 ${s}:00 ~ ${e}:00`);
      };

      const weekDays = useMemo(() => {
        const curr = new Date(currentDate);
        if (viewMode === 'day') {
          return [curr];
        }
        const day = curr.getDay();
        const diff = curr.getDate() - day + (day === 0 ? -6 : 1);
        const monday = new Date(curr.setDate(diff));

        const days = [];
        for (let i = 0; i < 7; i++) {
          const d = new Date(monday);
          d.setDate(monday.getDate() + i);
          days.push(d);
        }
        return days;
      }, [currentDate, viewMode]);

      const hours = useMemo(() => {
        const arr = [];
        for (let h = startHour; h < endHour; h++) {
          arr.push(h);
        }
        return arr;
      }, [startHour, endHour]);

      const formatDateStr = (dateObj) => {
        const y = dateObj.getFullYear();
        const m = String(dateObj.getMonth() + 1).padStart(2, '0');
        const d = String(dateObj.getDate()).padStart(2, '0');
        return `${y}-${m}-${d}`;
      };

      const handlePrevWeek = () => {
        const d = new Date(currentDate);
        d.setDate(d.getDate() - (viewMode === 'week' ? 7 : 1));
        setCurrentDate(d);
      };

      const handleNextWeek = () => {
        const d = new Date(currentDate);
        d.setDate(d.getDate() + (viewMode === 'week' ? 7 : 1));
        setCurrentDate(d);
      };

      const handleToday = () => {
        setCurrentDate(new Date());
      };

      const openCreateModal = (dateStr, hour) => {
        const start = `${String(hour).padStart(2, '0')}:00`;
        const end = `${String(Math.min(endHour, hour + 2)).padStart(2, '0')}:00`;
        setModalState({
          isOpen: true,
          data: { date: dateStr, startTime: start, endTime: end },
        });
      };

      const openEditModal = (lesson) => {
        setModalState({ isOpen: true, data: lesson });
      };

      const handleDragStart = (e, lesson) => {
        setDraggedLesson(lesson);
        e.dataTransfer.setData('text/plain', lesson.id);
        e.dataTransfer.effectAllowed = 'move';
      };

      const handleDragOver = (e, key) => {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        if (dragOverKey !== key) {
          setDragOverKey(key);
        }
      };

      const handleDragLeave = () => {
        setDragOverKey(null);
      };

      const handleDrop = (e, targetDateStr, targetHour) => {
        e.preventDefault();
        setDragOverKey(null);
        if (!draggedLesson) return;

        const duration = draggedLesson.duration || 2;
        const newStart = `${String(targetHour).padStart(2, '0')}:00`;
        
        const endH = targetHour + Math.floor(duration);
        const endM = Math.round((duration % 1) * 60);
        const newEnd = `${String(endH).padStart(2, '0')}:${String(endM).padStart(2, '0')}`;

        const updatedPayload = {
          ...draggedLesson,
          date: targetDateStr,
          startTime: newStart,
          endTime: newEnd,
        };

        const success = saveLesson(updatedPayload);
        if (success) {
          showToast(`已將課程拖曳移動至【${targetDateStr} ${newStart} - ${newEnd}】！`, 'success');
        }
        setDraggedLesson(null);
      };

      const dayNames = ['週一', '週二', '週三', '週四', '週五', '週六', '週日'];
      const slotHeight = 76;

      return (
        <div className="space-y-4 animate-fade-in">
          {/* Top Bar */}
          <div className="flex flex-col lg:flex-row lg:items-center justify-between gap-3 bg-white p-4 rounded-2xl border border-slate-200/80 shadow-soft">
            <div className="flex items-center gap-3">
              <div className="flex items-center bg-slate-100 p-1 rounded-xl">
                <button
                  onClick={handlePrevWeek}
                  className="p-1.5 hover:bg-white rounded-lg text-slate-600 transition-colors"
                  title="上一週"
                >
                  <Icon name="ChevronLeft" size={16} />
                </button>
                <button
                  onClick={handleToday}
                  className="px-3 py-1 text-xs font-bold text-slate-700 hover:bg-white rounded-lg transition-colors"
                >
                  今天
                </button>
                <button
                  onClick={handleNextWeek}
                  className="p-1.5 hover:bg-white rounded-lg text-slate-600 transition-colors"
                  title="下一週"
                >
                  <Icon name="ChevronRight" size={16} />
                </button>
              </div>

              <h2 className="text-base sm:text-lg font-bold text-slate-800 tracking-tight">
                {currentDate.getFullYear()} 年 {currentDate.getMonth() + 1} 月
              </h2>
            </div>

            <div className="flex flex-wrap items-center gap-2.5">
              <div className="flex items-center gap-1.5 bg-slate-50 px-3 py-1.5 rounded-xl border border-slate-200/70 text-xs text-slate-600">
                <Icon name="Clock" size={14} className="text-indigo-600" />
                <span className="font-semibold text-slate-700">上班時間：</span>
                <select
                  value={startHour}
                  onChange={(e) => handleUpdateBusinessHours(e.target.value, endHour)}
                  className="bg-white px-2 py-1 rounded-lg border border-slate-200 text-xs font-bold text-slate-800 focus:outline-none"
                >
                  {[6, 7, 8, 9, 10, 11, 12, 13, 14].map((h) => (
                    <option key={h} value={h}>{String(h).padStart(2, '0')}:00</option>
                  ))}
                </select>
                <span>至</span>
                <select
                  value={endHour}
                  onChange={(e) => handleUpdateBusinessHours(startHour, e.target.value)}
                  className="bg-white px-2 py-1 rounded-lg border border-slate-200 text-xs font-bold text-slate-800 focus:outline-none"
                >
                  {[18, 19, 20, 21, 22, 23, 24].map((h) => (
                    <option key={h} value={h}>{String(h).padStart(2, '0')}:00</option>
                  ))}
                </select>
              </div>

              <div className="flex bg-slate-100 p-1 rounded-xl text-xs font-semibold text-slate-600">
                <button
                  onClick={() => setViewMode('week')}
                  className={`px-3 py-1 rounded-lg transition-all ${
                    viewMode === 'week' ? 'bg-white text-indigo-600 shadow-sm font-bold' : 'hover:text-slate-900'
                  }`}
                >
                  週檢視
                </button>
                <button
                  onClick={() => setViewMode('day')}
                  className={`px-3 py-1 rounded-lg transition-all ${
                    viewMode === 'day' ? 'bg-white text-indigo-600 shadow-sm font-bold' : 'hover:text-slate-900'
                  }`}
                >
                  日檢視
                </button>
              </div>

              <button
                onClick={() => openCreateModal(formatDateStr(currentDate), 14)}
                className="px-3.5 py-2 bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white rounded-xl text-xs font-bold shadow-md shadow-indigo-100 flex items-center gap-1.5 transition-all"

                <span>排定課程</span>
              </button>
            </div>
          </div>

          {/* Schedule Grid */}

            <div className="overflow-x-auto">
              <div className={viewMode === 'week' ? "min-w-[760px]" : "min-w-[400px]"}>
                <div className={`grid border-b border-slate-100 bg-slate-50/70 text-xs font-bold text-slate-500 ${
                  viewMode === 'week' ? 'grid-cols-8' : 'grid-cols-2'
                }`}>
                  <div className="p-3.5 text-center border-r border-slate-100 w-16 shrink-0 flex items-center justify-center">
                    <Icon name="Clock" size={14} className="text-slate-400" />
                  </div>
                  {weekDays.map((d, i) => {
                    const isToday = formatDateStr(d) === formatDateStr(new Date());
                    const dayIndex = (d.getDay() + 6) % 7;
                    return (
                      <div
                        key={i}
                        className={`p-3 text-center border-r border-slate-100 last:border-r-0 ${
                          isToday ? 'bg-indigo-50/80 text-indigo-700' : ''
                        }`}
                      >
                        <div className="text-[11px] font-medium">{dayNames[dayIndex]}</div>
                        <div className={`text-base font-extrabold mt-0.5 ${isToday ? 'text-indigo-700' : 'text-slate-800'}`}>
                          {d.getDate()}
                        </div>
                      </div>
                    );
                  })}
                </div>

                <div className="divide-y divide-slate-100">
                  {hours.map((hour) => {
                    return (
                      <div
                        key={hour}
                        className={`grid ${viewMode === 'week' ? 'grid-cols-8' : 'grid-cols-2'}`}
                        style={{ height: `${slotHeight}px` }}
                      >
                        <div className="p-2 text-[11px] font-semibold text-slate-400 text-center border-r border-slate-100 bg-slate-50/30 flex items-start justify-center pt-2 select-none">
                          {String(hour).padStart(2, '0')}:00
                        </div>

                        {weekDays.map((d, dayIdx) => {
                          const dateStr = formatDateStr(d);
                          const slotKey = `${dateStr}_${hour}`;
                          const isDragOver = dragOverKey === slotKey;

                          const slotLessons = lessons.filter((l) => {
                            if (l.date !== dateStr) return false;
                            const [sH] = l.startTime.split(':').map(Number);
                            return sH === hour;
                          });

                          return (
                            <div
                              key={dayIdx}
                              onClick={() => openCreateModal(dateStr, hour)}
                              onDragOver={(e) => handleDragOver(e, slotKey)}
                              onDragLeave={handleDragLeave}
                              onDrop={(e) => handleDrop(e, dateStr, hour)}
                              className={`relative border-r border-slate-100 last:border-r-0 hover:bg-slate-50/70 transition-colors cursor-pointer group ${
                                isDragOver ? 'drag-over-slot' : ''
                              }`}
                            >
                              <div className="absolute inset-0 flex items-center justify-center opacity-0 group-hover:opacity-20 pointer-events-none text-slate-400">
                                <Icon name="Plus" size={16} />
                              </div>

                              {slotLessons.map((les) => {
                                const st = students.find((s) => s.id === les.studentId);
                                const theme = getTheme(st?.color || 'blue');
                                
                                const [sH, sM] = les.startTime.split(':').map(Number);
                                const topOffset = (sM / 60) * slotHeight;
                                const calculatedHeight = Math.max(38, les.duration * slotHeight - 6);

                                return (
                                  <div
                                    key={les.id}
                                    draggable="true"
                                    onDragStart={(e) => handleDragStart(e, les)}
                                    onClick={(e) => {
                                      e.stopPropagation();
                                      openEditModal(les);
                                    }}
                                    style={{
                                      position: 'absolute',
                                      top: `${topOffset + 3}px`,
                                      height: `${calculatedHeight}px`,
                                      left: '4px',
                                      right: '4px',
                                      zIndex: 20,
                                    }}
                                    className={`p-2 rounded-xl border ${theme.bg} ${theme.border} ${theme.text} shadow-sm hover:shadow-md transition-all cursor-move select-none flex flex-col justify-between overflow-hidden group/card ${
                                      draggedLesson?.id === les.id ? 'dragging-lesson' : ''
                                    }`}
                                    title="按住滑鼠或拖曳可更換上課時間與日期"
                                  >
                                    <div>
                                      <div className="flex items-center justify-between gap-1">
                                        <span className="font-extrabold text-xs truncate">
                                          {st?.name || '未知學生'}
                                        </span>
                                        <div className="flex items-center gap-1">
                                          <Icon name="Move" size={11} className="opacity-0 group-hover/card:opacity-60 transition-opacity" />
                                          <span className="text-[10px] font-bold opacity-80 shrink-0">
                                            {les.startTime} - {les.endTime}
                                          </span>
                                        </div>
                                      </div>
                                      <div className="text-[11px] font-semibold opacity-90 truncate mt-0.5">
                                        {les.subject} ({les.duration} hr)
                                      </div>
                                    </div>

                                    {calculatedHeight > 60 && les.plannedProgress && (
                                      <div className="text-[10px] opacity-80 truncate flex items-center gap-1 mt-1 pt-1 border-t border-current/15">
                                        <span className="truncate">📌 {les.plannedProgress}</span>
                                      </div>
                                    )}
                                  </div>
                                );
                              })}
                            </div>
                          );
                        })}
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>
          </div>

          <LessonFormModal
            isOpen={modalState.isOpen}
            initialData={modalState.data}
            onClose={() => setModalState({ isOpen: false, data: null })}
          />
        </div>
      );
    };

                  )}
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    };

    const BillBreakdownModal = ({ isOpen, group, onClose, onConfirmSettleSelected }) => {
      if (!isOpen || !group) return null;

      const { student, subject, items, hourlyRate, defaultPricing } = group;
      const todayStr = new Date().toISOString().split('T')[0];

      // Strict String ID array for tracking individual checkbox selection
      const [selectedIds, setSelectedIds] = useState([]);

      // Reset selection strictly using stringified lesson IDs whenever group opens or changes
      useEffect(() => {
        if (group && group.items) {
          const completedStringIds = group.items
            .filter((les) => les.date <= todayStr)
            .map((les) => String(les.id));
          setSelectedIds(completedStringIds);
        }
      }, [group, todayStr]);

      const selectedItems = items.filter((les) => selectedIds.includes(String(les.id)));
      const selectedHours = selectedItems.reduce((acc, les) => acc + (les.duration || 1), 0);
      const selectedAmount = selectedHours * hourlyRate;
      const futureItemsCount = items.filter((les) => les.date > todayStr).length;

      const handleToggleItem = (id) => {
        const strId = String(id);
        setSelectedIds((prev) =>
          prev.includes(strId) ? prev.filter((item) => item !== strId) : [...prev, strId]
        );
      };

      const handleSelectOnlyCompleted = () => {
        setSelectedIds(items.filter((les) => les.date <= todayStr).map((les) => String(les.id)));
      };

      const handleSelectAll = () => {
        setSelectedIds(items.map((les) => String(les.id)));
      };

      const handleDeselectAll = () => {
        setSelectedIds([]);
      };

        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm overflow-y-auto animate-fade-in">

              <div className="p-3 bg-slate-50 rounded-xl border border-slate-100 text-xs space-y-1">
                <div className="font-bold text-slate-700">預設收款資訊：</div>

    // ==========================================
    // 14. MODULE 4: FINANCE VIEW
    // ==========================================
    const FinanceModule = () => {
      const { students, lessons, pricingRules, settleLessonsBatch, isFinanceUnlocked, setIsFinanceUnlocked } = useContext(TutorContext);

      const [isAccordionOpen, setIsAccordionOpen] = useState(false);
      const [selectedMonth, setSelectedMonth] = useState('2026-08');
      const [isPricingModalOpen, setIsPricingModalOpen] = useState(false);
      const [breakdownGroup, setBreakdownGroup] = useState(null);
      const [isPinModalOpen, setIsPinModalOpen] = useState(false);

      const todayStr = new Date().toISOString().split('T')[0];

      const pendingGroups = useMemo(() => {
        const pendingLessons = lessons.filter((l) => l.status === 'pending');
        const groups = {};

        pendingLessons.forEach((les) => {
          const st = students.find((s) => s.id === les.studentId);
          if (!st) return;

          const key = `${les.studentId}_${les.subject}`;
          if (!groups[key]) {
            const rule = pricingRules.find(
              (pr) => pr.studentId === les.studentId && pr.subject === les.subject
            );
            const rate = rule ? rule.hourlyRate : 900;

            groups[key] = {
              key,
              student: st,
              subject: les.subject,
              items: [],
              totalHours: 0,
              hourlyRate: rate,
              defaultPricing: rule || { paymentMethod: '銀行轉帳', paymentNote: '' },
            };
          }

          groups[key].items.push(les);
          groups[key].totalHours += les.duration || 1;
        });

        return Object.values(groups).map((g) => ({

          totalAmount: g.totalHours * g.hourlyRate,

                <p className="text-[11px] text-slate-400">一鍵下載所有學生、排課與帳務紀錄</p>
              </button>

              <div className="p-4 bg-slate-50 border border-slate-200/80 rounded-2xl text-left opacity-80">
                <div className="flex items-center justify-between mb-1">
                  <span className="font-bold text-slate-800 text-xs">Google Drive 雲端同步</span>
                  <span className="text-[10px] bg-slate-200 text-slate-600 px-1.5 py-0.5 rounded">雲端預留</span>
                </div>
                <p className="text-[11px] text-slate-400">排程每日自動將備份加密同步至雲端硬碟</p>
              </div>

              <button
                onClick={() => {
                  if (confirm('確定要恢復預設展示資料嗎？目前的所有自訂變更將被重置。')) {
                    resetDemoData();
                  }
                }}
                className="p-4 bg-rose-50/60 hover:bg-rose-100/80 border border-rose-200/60 rounded-2xl text-left transition-colors group"
              >
                <div className="flex items-center justify-between mb-1">
                  <span className="font-bold text-rose-800 text-xs">重置為範例資料</span>
                  <Icon name="RefreshCw" size={16} className="text-rose-600 group-hover:rotate-45 transition-transform" />
                </div>
                <p className="text-[11px] text-rose-500">重新載入示範學員與排課模型</p>
              </button>
            </div>
          </div>
        </div>
      );
    };

    // ==========================================
    // 16. MAIN APP SHELL & RESPONSIVE LAYOUT
    // ==========================================
    const MainApp = () => {
      const { isLoggedIn, setIsLoggedIn, userSettings } = useContext(TutorContext);
      const [activeTab, setActiveTab] = useState('calendar');
      const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);

      if (!isLoggedIn) {
        return <LoginView />;
      }

      const navItems = [
        { id: 'calendar', label: '行事曆排課', icon: 'Calendar' },
        { id: 'students', label: '學生管理檔案', icon: 'Users' },
        { id: 'finance', label: '財務結算中心', icon: 'Wallet' },
        { id: 'settings', label: '系統與雲端設定', icon: 'Settings' },
      ];

      return (
        <div className="min-h-screen bg-slate-100 flex flex-col md:flex-row font-sans">
          <ToastContainer />

          <div className="md:hidden bg-white border-b border-slate-200 px-4 py-3 flex items-center justify-between sticky top-0 z-30 shadow-sm">
            <div className="flex items-center gap-2.5">
              <div className="w-8 h-8 rounded-xl bg-indigo-600 text-white flex items-center justify-center font-bold shadow-md shadow-indigo-200">
                <Icon name="BookOpen" size={16} />
              </div>
              <span className="font-extrabold text-slate-800 text-base">TutorFlow</span>
            </div>

            <button
              onClick={() => setIsMobileMenuOpen(true)}
              className="p-2 text-slate-600 hover:bg-slate-100 rounded-xl transition-colors"
              aria-label="開啟選單"
            >
              <Icon name="Menu" size={22} />
            </button>
          </div>

          {isMobileMenuOpen && (
            <div className="fixed inset-0 z-50 md:hidden flex">
              <div
                className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm animate-fade-in"
                onClick={() => setIsMobileMenuOpen(false)}
              ></div>
              <div className="relative w-4/5 max-w-xs bg-white h-full shadow-2xl p-6 flex flex-col justify-between z-10 animate-fade-in">
                <div>
                  <div className="flex items-center justify-between pb-6 border-b border-slate-100">
                    <div className="flex items-center gap-2.5">
                      <div className="w-8 h-8 rounded-xl bg-indigo-600 text-white flex items-center justify-center font-bold">
                        <Icon name="BookOpen" size={16} />
                      </div>
                      <span className="font-extrabold text-slate-800 text-base">TutorFlow</span>
                    </div>
                    <button
                      onClick={() => setIsMobileMenuOpen(false)}
                      className="p-1.5 text-slate-400 hover:text-slate-600 rounded-lg"
                    >
                      <Icon name="X" size={18} />
                    </button>
                  </div>

                  <nav className="mt-6 space-y-1.5">
                    {navItems.map((item) => {
                      const isActive = activeTab === item.id;
                      return (
                        <button
                          key={item.id}
                          onClick={() => {
                            setActiveTab(item.id);
                            setIsMobileMenuOpen(false);
                          }}
                          className={`w-full flex items-center gap-3 px-4 py-3 rounded-2xl text-xs font-bold transition-all ${
                            isActive
                              ? 'bg-indigo-600 text-white shadow-md shadow-indigo-200'
                              : 'text-slate-600 hover:bg-slate-50'
                          }`}
                        >
                          <Icon name={item.icon} size={18} />
                          <span>{item.label}</span>
                        </button>
                      );
                    })}
                  </nav>
                </div>

                <div className="pt-4 border-t border-slate-100">
                  <div className="mb-3 px-1">
                    <div className="font-bold text-slate-800 text-xs">{userSettings.teacherName}</div>
                    <div className="text-[10px] text-slate-400">{userSettings.title}</div>
                  </div>
                  <button
                    onClick={() => setIsLoggedIn(false)}
                    className="w-full py-2 bg-slate-100 text-slate-600 hover:text-rose-600 rounded-xl text-xs font-bold transition-colors flex items-center justify-center gap-1.5"
                  >
                    <Icon name="LogOut" size={14} />
                    <span>登出系統</span>
                  </button>
                </div>
              </div>
            </div>
          )}

          <aside className="hidden md:flex flex-col justify-between w-64 lg:w-72 bg-white border-r border-slate-200/80 p-5 shrink-0 h-screen sticky top-0 select-none shadow-soft">
            <div>
              <div className="flex items-center gap-3 px-2 py-3 mb-6">
                <div className="w-10 h-10 rounded-2xl bg-indigo-600 text-white flex items-center justify-center font-black shadow-lg shadow-indigo-200">
                  <Icon name="BookOpen" size={20} />
                </div>
                <div>
                  <h1 className="font-extrabold text-slate-900 text-lg tracking-tight">TutorFlow</h1>
                  <p className="text-[11px] text-slate-400 font-semibold">家教排課管理系統</p>
                </div>
              </div>

              <nav className="space-y-1.5">
                {navItems.map((item) => {
                  const isActive = activeTab === item.id;
                  return (
                    <button
                      key={item.id}
                      onClick={() => setActiveTab(item.id)}
                      className={`w-full flex items-center gap-3 px-4 py-3 rounded-2xl text-xs font-bold transition-all ${
                        isActive
                          ? 'bg-indigo-600 text-white shadow-md shadow-indigo-200 translate-x-1'
                          : 'text-slate-600 hover:bg-slate-50 hover:text-slate-900'
                      }`}
                    >
                      <Icon name={item.icon} size={18} />
                      <span>{item.label}</span>
                    </button>
                  );
                })}
              </nav>
            </div>

            <div className="p-3 bg-slate-50 rounded-2xl border border-slate-100 flex items-center justify-between">
              <div className="overflow-hidden">
                <div className="font-bold text-slate-800 text-xs truncate">{userSettings.teacherName}</div>
                <div className="text-[10px] text-slate-400 truncate">{userSettings.title}</div>
              </div>

              <button
                onClick={() => setIsLoggedIn(false)}
                className="p-1.5 text-slate-400 hover:text-rose-600 rounded-lg hover:bg-white transition-colors shrink-0"
                title="登出系統"
              >
                <Icon name="LogOut" size={16} />
              </button>
            </div>
          </aside>

          <main className="flex-1 p-4 sm:p-6 lg:p-8 max-w-7xl mx-auto w-full overflow-x-hidden">
            {activeTab === 'calendar' && <CalendarModule />}
            {activeTab === 'students' && <StudentModule />}
            {activeTab === 'finance' && <FinanceModule />}
            {activeTab === 'settings' && <SettingsModule />}
          </main>
        </div>
      );
    };

    // ==========================================
    // 17. APP ENTRY POINT
    // ==========================================
    const App = () => {
      return (
        <TutorProvider>
          <MainApp />
        </TutorProvider>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
